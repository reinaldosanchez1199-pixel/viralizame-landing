name: Fix Growth spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-growth-spacing.yml'

permissions:
  contents: write

jobs:
  fix-spacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust spacing above Growth benefits
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'margin:-10px auto 28px'
          new = 'margin:8px auto 28px'
          if old not in s:
              raise SystemExit('Target spacing string not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve spacing in Growth benefits"
          git push
